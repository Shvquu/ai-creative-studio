id: social-media/youtube-thumbnail
name: YouTube-Thumbnail
description: Plakativer Hintergrund, exakt 1280×720 zugeschnitten, mit großem Titel und Prüfung gegen YouTube-Vorgaben.
category: social-media
tags: [youtube, thumbnail]
inputs:
  topic: {type: text, required: true, label: Motiv / Thema}
  title: {type: string, required: true, label: Titel (kurz, 2–5 Wörter)}
  subtitle: {type: string}
  accent: {type: color, default: "#FACC15"}
  text_position: {type: choice, default: left, options: [left, right, bottom, top, center]}
  variants: {type: integer, default: 2, min: 1, max: 4}
  image_provider: {type: string}
steps:
  - id: background
    label: Hintergrund
    action: image.generate
    params:
      provider: "{{ inputs.image_provider }}"
      prompt: "{{ inputs.topic }}"
      style: thumbnail
      aspect_ratio: "16:9"
      batch_size: "{{ inputs.variants }}"
  - id: sized
    action: image.resize
    foreach: "{{ steps.background.asset_ids }}"
    params: {source: "{{ item }}", format_preset: youtube_thumbnail, mode: crop, output_format: jpg}
  - id: titled
    label: Titel setzen
    action: image.text_overlay
    foreach: "{{ steps.sized.asset_ids }}"
    params:
      source: "{{ item }}"
      title: "{{ inputs.title }}"
      subtitle: "{{ inputs.subtitle }}"
      accent: "{{ inputs.accent }}"
      position: "{{ inputs.text_position }}"
      uppercase: true
      font_scale: 1.3
  - id: qa
    action: quality.analyze
    params: {assets: "{{ steps.titled.asset_ids }}", preset: youtube_thumbnail, min_width: 1280, min_height: 720, expected_aspect: "16:9"}
outputs:
  thumbnails: "{{ steps.titled.asset_ids }}"
  passed: "{{ steps.qa.passed }}"
