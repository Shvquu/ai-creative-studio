id: videos/kenburns-slideshow
name: Ken-Burns-Video (CPU-tauglich)
description: >-
  Video ohne KI-Videomodell: Standbilder (generiert oder vorhanden) mit Kamerafahrten (Zoom/Pan),
  Übergängen, Musik und Untertiteln. Fallback für Systeme ohne GPU.
category: videos
tags: [video, fallback, slideshow, cpu]
inputs:
  scenes:
    type: list
    description: 'Szenen zum Generieren: [{"prompt": "...", "duration_s": 4, "caption": "..."}]'
  images: {type: assets, label: Vorhandene Bilder (statt Generierung)}
  prompt: {type: text, label: Einzelne Beschreibung (wenn keine Szenen)}
  style: {type: choice, default: cinematic, options: [cinematic, photorealistic, product, illustration, anime, 3d-render]}
  aspect_ratio: {type: choice, default: "16:9", options: ["16:9", "9:16", "1:1"]}
  duration_s: {type: number, default: 4, min: 1, max: 20}
  transition: {type: choice, default: fade, options: [none, fade, dissolve, wipeleft, slideleft, fadeblack, circleopen, smoothleft]}
  music: {type: asset}
  subtitles: {type: boolean, default: true}
  title: {type: string}
  image_provider: {type: string}
steps:
  - id: plan
    action: util.set
    params:
      scenes: "{{ inputs.scenes or ([{'prompt': inputs.prompt, 'duration_s': inputs.duration_s}] if inputs.prompt else []) }}"
  - id: stills
    label: Standbilder generieren
    action: image.generate
    when: "{{ not inputs.images }}"
    foreach: "{{ steps.plan.scenes }}"
    as: scene
    params:
      provider: "{{ inputs.image_provider }}"
      prompt: "{{ scene.prompt }}"
      style: "{{ inputs.style }}"
      aspect_ratio: "{{ inputs.aspect_ratio }}"
      tags: [slideshow]
  - id: timeline
    action: timeline.from_assets
    params:
      assets: "{{ inputs.images or steps.stills.asset_ids }}"
      durations: "{{ steps.plan.scenes | map(attribute='duration_s') | list if steps.plan.scenes else [] }}"
      duration_s: "{{ inputs.duration_s }}"
      captions: "{{ steps.plan.scenes | map(attribute='caption') | list if steps.plan.scenes else [] }}"
      ken_burns: alternate
      transition: "{{ inputs.transition }}"
  - id: edit
    label: Video rendern
    action: process.render
    params:
      clips: "{{ steps.timeline.clips }}"
      width: "{{ 1920 if inputs.aspect_ratio == '16:9' else 1080 }}"
      height: "{{ 1080 if inputs.aspect_ratio != '9:16' else 1920 }}"
      fps: 30
      transition: "{{ inputs.transition }}"
      audio: "{{ {'source': inputs.music, 'fade_out_s': 1.5} if inputs.music else None }}"
      subtitles: "{{ steps.timeline.subtitles if inputs.subtitles and steps.timeline.subtitles else None }}"
      output_name: "{{ (inputs.title or 'slideshow') | slug }}"
  - id: qa
    action: quality.analyze
    params: {assets: "{{ steps.edit.asset_ids }}"}
outputs:
  video: "{{ steps.edit.asset.id }}"
  stills: "{{ inputs.images or steps.stills.asset_ids }}"
