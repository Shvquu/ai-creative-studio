id: images/product-photo
name: Produktfoto
description: Werbetaugliches Produktfoto im Studio-Look, optional freigestellt und im Social-Format exportiert.
category: images
tags: [produkt, e-commerce, werbung]
inputs:
  product: {type: text, required: true, label: Produkt (z. B. "matte black water bottle with bamboo lid")}
  setting: {type: text, default: "on a seamless light grey studio background with soft reflections", label: Szene}
  mood: {type: string, default: "premium, minimal", label: Stimmung}
  aspect_ratio: {type: choice, default: "4:3", options: ["1:1", "4:3", "3:4", "16:9", "9:16"]}
  variants: {type: integer, default: 2, min: 1, max: 4}
  remove_background: {type: boolean, default: false, label: Freistellen (rembg)}
  social_format: {type: choice, default: none, options: [none, instagram_post, instagram_portrait, instagram_story, og_image]}
  image_provider: {type: string}
steps:
  - id: generate
    label: Produktbild generieren
    action: image.generate
    params:
      provider: "{{ inputs.image_provider }}"
      prompt: "{{ inputs.product }}, {{ inputs.setting }}, {{ inputs.mood }}"
      style: product
      aspect_ratio: "{{ inputs.aspect_ratio }}"
      batch_size: "{{ inputs.variants }}"
      tags: [product]
  - id: cutout
    label: Hintergrund entfernen
    action: image.remove_background
    when: "{{ inputs.remove_background and caps.rembg }}"
    foreach: "{{ steps.generate.asset_ids }}"
    params: {source: "{{ item }}"}
  - id: social
    label: Social-Format
    action: image.resize
    when: "{{ inputs.social_format != 'none' }}"
    foreach: "{{ steps.generate.asset_ids }}"
    params: {source: "{{ item }}", format_preset: "{{ inputs.social_format }}", mode: crop}
  - id: qa
    action: quality.analyze
    params: {assets: "{{ steps.generate.asset_ids }}"}
outputs:
  images: "{{ steps.generate.asset_ids }}"
  cutouts: "{{ steps.cutout.asset_ids }}"
  social: "{{ steps.social.asset_ids }}"
