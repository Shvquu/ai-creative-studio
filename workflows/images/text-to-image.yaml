id: images/text-to-image
name: Text zu Bild
description: Bild aus einer Beschreibung erzeugen – hardwaregerechte Modellwahl, Varianten, optional Upscaling, Qualitätsprüfung.
category: images
tags: [bild, generierung]
requires: []
inputs:
  prompt: {type: text, required: true, label: Bildbeschreibung}
  negative_prompt: {type: text, label: Negativ-Prompt}
  style: {type: choice, default: photorealistic, options: [photorealistic, cinematic, product, illustration, isometric, anime, watercolor, 3d-render, social-bold, thumbnail, logo-flat, logo-3d]}
  aspect_ratio: {type: choice, default: "1:1", options: ["1:1", "3:2", "2:3", "4:3", "3:4", "16:9", "9:16", "21:9"]}
  variants: {type: integer, default: 2, min: 1, max: 4, label: Varianten}
  model: {type: string, label: Modell (leer = automatisch)}
  seed: {type: integer, label: Seed (leer = zufällig)}
  upscale: {type: boolean, default: false, label: "Anschließend 2× hochskalieren"}
  image_provider: {type: string, label: "Provider (leer = Standard, 'mock' = Testmodus)"}
steps:
  - id: generate
    label: Bilder generieren
    action: image.generate
    params:
      provider: "{{ inputs.image_provider }}"
      prompt: "{{ inputs.prompt }}"
      negative_prompt: "{{ inputs.negative_prompt }}"
      style: "{{ inputs.style }}"
      aspect_ratio: "{{ inputs.aspect_ratio }}"
      batch_size: "{{ inputs.variants }}"
      model: "{{ inputs.model }}"
      seed: "{{ inputs.seed }}"
      tags: [text-to-image]
  - id: upscale
    label: Hochskalieren
    action: image.upscale
    when: "{{ inputs.upscale }}"
    foreach: "{{ steps.generate.asset_ids }}"
    params: {source: "{{ item }}", scale: 2}
  - id: qa
    label: Qualitätsprüfung
    action: quality.analyze
    params:
      assets: "{{ steps.upscale.asset_ids if inputs.upscale else steps.generate.asset_ids }}"
outputs:
  images: "{{ steps.upscale.asset_ids if inputs.upscale else steps.generate.asset_ids }}"
  seed: "{{ steps.generate.seed }}"
  model: "{{ steps.generate.model }}"
  quality_passed: "{{ steps.qa.passed }}"
